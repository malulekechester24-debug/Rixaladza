<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Chester Logistics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', Arial, sans-serif}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  /* BEAUTIFUL BACKGROUND PICTURE */
  background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), 
              url('https://secure-web.cisco.com/1RyIpCKwTncoUOaym7-j6PhQAeddmRg7jU7bprCfJ8C_qTUK5Rs5AA63ByOhr0porVg6nz5Wr8OY7t5U_T_BKeP1JtsqUf65qNGydJZMzCRT9I_yL0iQRbK9FG1SDu6yasIbNLIUfq-3q1B0TgNkq2h_bhj8wys6Fd0tHk_zwrnDdGxGoYKsWAR3BvBIQDIFnfs7aCn2K08xqsXhWwTyG-k-krRBVwLgNqMDISc2MxMXprMJh_A2xvreeT8661Gh5LFNn16Bg4z7fNwlUJyP3kODXrNxob2o4G17jpbXfDp32dgM7tGEtljavCq11mVt4nvn0Obax-EU0XFraR2JIyg/https%3A%2F%2Fimages.unsplash.com%2Fphoto-1586528116311-ad8dd3c8310d%3Fq%3D80%26w%3D2070') no-repeat center center/cover;
}
.box{
  background: rgba(17,17,17,0.9);
  backdrop-filter: blur(10px);
  border:1px solid #d4a017;
  padding:35px 30px;
  border-radius:20px;
  width:100%;
  max-width:400px;
  text-align:center;
  box-shadow: 0 0 30px rgba(212,160,23,0.3), 0 10px 40px rgba(0,0,0,0.8);
}
.logo{font-size:40px;margin-bottom:10px}
h2{color:#d4a017;margin-bottom:5px;letter-spacing:1px}
.subtitle{font-size:13px;color:#aaa;margin-bottom:20px}
input{
  width:100%;
  padding:13px 15px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #333;
  background:rgba(34,34,34,0.9);
  color:#fff;
  outline:none;
  transition:0.3s;
}
input:focus{border-color:#d4a017;box-shadow:0 0 8px rgba(212,160,23,0.5)}
button{
  width:100%;
  padding:13px;
  background:linear-gradient(135deg, #d4a017, #ffcc33);
  color:#000;
  font-weight:bold;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-top:12px;
  font-size:15px;
  letter-spacing:0.5px;
  transition:0.3s;
}
button:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(212,160,23,0.4)}
a{color:#d4a017;text-decoration:none;display:block;margin-top:16px;font-size:14px}
a:hover{text-decoration:underline}
.error{color:#ff5555;margin-top:12px;font-size:13px;display:none;background:rgba(255,0,0,0.1);padding:8px;border-radius:6px;border:1px solid rgba(255,0,0,0.2)}
.divider{margin:20px 0;height:1px;background:linear-gradient(to right, transparent, #333, transparent)}
</style>
</head>
<body>

<div class="box">
<div class="logo">🚛</div>
<h2>CHESTER LOGISTICS</h2>
<p class="subtitle">Secure Login - Login every time for safety</p>

<input type="email" id="email" placeholder="📧 Email address">
<input type="password" id="pass" placeholder="🔒 Password">

<button type="button" onclick="doLogin()">LOGIN →</button>

<div id="err" class="error"></div>

<div class="divider"></div>

<a href="signup.html">No account? Create account here</a>
<a href="index.html" style="color:#777;font-size:12px">← Back to website (will ask login)</a>
</div>

<script>
localStorage.removeItem('chester_logged');

function doLogin(){
  var email = document.getElementById('email').value.trim();
  var pass = document.getElementById('pass').value.trim();
  var errEl = document.getElementById('err');
  
  if(!email || !pass){
    errEl.style.display='block';
    errEl.innerText='⚠️ Please enter email and password';
    return;
  }

  if(email.toLowerCase() === "malulekchester24@gmail.com"){
    sessionStorage.setItem('chester_logged', email);
    sessionStorage.setItem('lastActive', Date.now());
    alert('Welcome Boss Chester!');
    window.location.href = 'index.html';
    return;
  }
  if(email.toLowerCase() === "admin" && pass === "Chester2024!"){
    sessionStorage.setItem('chester_logged', email);
    sessionStorage.setItem('chester_admin', 'true');
    window.location.href = 'admin.html';
    return;
  }

  var users = JSON.parse(localStorage.getItem('chester_users') || '[]');
  var found = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.pass === pass);

  if(found){
    sessionStorage.setItem('chester_logged', found.email);
    sessionStorage.setItem('lastActive', Date.now().toString());
    errEl.style.display='none';
    
    // Small delay so you see it works
    document.querySelector('button').innerText = '✅ Success! Redirecting...';
    setTimeout(function(){ window.location.href = 'index.html'; }, 800);
    
  } else {
    var exists = users.find(u => u.email.toLowerCase() === email.toLowerCase());
    errEl.style.display='block';
    if(exists){
      errEl.innerText = '❌ Wrong password for ' + email;
    } else {
      errEl.innerText = '❌ No account found. Please SIGN UP first.';
    }
  }
}

document.getElementById('pass').addEventListener('keypress', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('email').addEventListener('keypress', e => { if(e.key==='Enter') doLogin(); });
</script>

</body>
</html>
